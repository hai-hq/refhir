name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=8

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test Go client
        working-directory: clients/go
        env:
          REFHIR_BIN: ../../target/debug/refhir
        run: go test ./...

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test TypeScript client
        working-directory: clients/ts
        env:
          REFHIR_BIN: ../../target/debug/refhir
        run: |
          npm ci
          npm run build
          npm test

  release-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build refhir (release)
        run: cargo build --release -p refhir
