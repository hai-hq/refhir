name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=8

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test Go client
        working-directory: clients/go
        env:
          REFHIR_BIN: ../../target/debug/refhir
          REFHIR_SKIP_DEFAULT_PACKAGES: "1"
        run: go test ./...

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test TypeScript client
        working-directory: clients/ts
        env:
          REFHIR_BIN: ../../target/debug/refhir
          REFHIR_SKIP_DEFAULT_PACKAGES: "1"
        run: |
          npm ci
          npm run build
          npm test

  postgres:
    name: Postgres tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAIFHIR_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres
      # Fail instead of skipping when the database is missing.
      REFHIR_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test Postgres backend
        run: cargo test -p refhir-postgres

  release-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build refhir (release)
        run: cargo build --release -p refhir
