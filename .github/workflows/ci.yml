name: CI

# Pull requests get the fast checks: formatting, clippy, build and test, dependency policy, the Helm
# chart and the docs links. The slower ones (Postgres and multi-process tests, the release build and
# the container image) run on every push to main, and on demand for a branch: Actions -> CI -> Run
# workflow. Those jobs are marked "main only" below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      perf:
        description: "Also run the performance check (about 45 minutes)"
        type: boolean
        default: false

# Workflows get a read-only token unless a job asks for more.
permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --locked -- --test-threads=8

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Check the Go client
        working-directory: clients/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above need formatting"; exit 1; }
          go vet ./...

      - name: Test Go client
        working-directory: clients/go
        env:
          REFHIR_BIN: ../../target/debug/refhir
          REFHIR_SKIP_DEFAULT_PACKAGES: "1"
        run: go test ./...

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test TypeScript client
        working-directory: clients/ts
        env:
          REFHIR_BIN: ../../target/debug/refhir
          REFHIR_SKIP_DEFAULT_PACKAGES: "1"
        run: |
          npm ci
          npm run build
          npm test

  # The link host: a TypeScript server that keeps its links in Postgres or SQLite. Its tests run on the
  # memory store, and again on each database, so that everything it does is checked against all three.
  link-host:
    name: Link host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINK_HOST_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: link-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: link-host/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test, with links kept in memory where a test does not need a database
        run: npm test

      - name: Test again, with every test of the host on SQLite
        run: npm test
        env:
          LINK_HOST_TEST_STORE: sqlite

      - name: Test again, with every test of the host on Postgres
        run: npm test
        env:
          LINK_HOST_TEST_STORE: postgres

      - name: Check the compose file
        working-directory: link-host/deploy
        run: |
          DOMAIN=links.example.org ADMIN_TOKEN=ci-token-of-sixteen-characters POSTGRES_PASSWORD=ci docker compose config --quiet
          DOMAIN=links.example.org ADMIN_TOKEN=ci-token-of-sixteen-characters docker compose -f compose.sqlite.yaml config --quiet

  # Warnings fail the build, so the code base stays clean. The toolchain is the pinned 1.88.0,
  # whose lints are the ones that count: a newer clippy knows lints this one does not.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Main only.
  postgres:
    name: Postgres tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REFHIR_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=postgres
      # Fail instead of skipping when the database is missing.
      REFHIR_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test Postgres backend
        run: cargo test -p refhir-postgres --locked

      # The tenancy tests again as an ordinary role, which row-level security binds. The run above
      # is as the superuser, which it does not, so that a statement that forgot its tenant fails.
      - name: Test Postgres backend under row-level security
        env:
          REFHIR_TEST_ROW_SECURITY: "1"
        run: cargo test -p refhir-postgres --locked tenancy

      - name: Test installing packages into Postgres
        run: cargo test -p refhir-fhir --locked --test install_memory_postgres

      # Two tenants on one database are given the packages the first installed, without storing
      # them again.
      - name: Test tenants sharing packages
        run: cargo test -p refhir-fhir --locked --test shared_catalog

      # The service above does not speak TLS, so this starts a TLS-only Postgres of its own
      # (certificates, client-certificate role and all) and runs the TLS tests against it.
      - name: Test Postgres over TLS
        env:
          REFHIR_REQUIRE_POSTGRES_TLS: "1"
        run: |
          out="$(scripts/postgres-tls-test.sh up)"
          eval "$out"
          cargo test -p refhir-postgres --locked tls

      # Starts real refhir processes (primary, standby, replicas, tenants) on databases of their own
      # and kills the primary while writes are in flight. The Postgres role may create databases.
      - name: Test several processes on one database
        run: cargo test -p refhir --locked --test cluster -- --test-threads=4

  # Main only.
  release-binary:
    name: Build release binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build refhir (release)
        run: cargo build --release --locked -p refhir

      - name: Smoke test the binary
        run: target/release/refhir --version

  # The image is what most people run, so build it on every push to main. It is not pushed: only
  # the release workflow publishes. Main only.
  docker:
    name: Build container image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: refhir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image
        run: docker run --rm refhir:ci --version

      - name: Build the link host image, and see that it starts on Postgres, is ready, and stops cleanly
        run: |
          docker build -t refhir-link-host:ci link-host
          docker network create link-host-ci
          docker run -d --name link-host-ci-db --network link-host-ci \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=links postgres:17-alpine
          docker run -d --name link-host-ci --network link-host-ci --read-only --tmpfs /tmp --cap-drop ALL \
            -e ADMIN_TOKEN=ci-token-of-sixteen-characters -e PUBLIC_URL=https://links.example.org \
            -e DATABASE_URL=postgres://postgres:ci@link-host-ci-db:5432/links refhir-link-host:ci
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' link-host-ci)" = "healthy" ] && break
            sleep 2
          done
          docker logs link-host-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' link-host-ci)" = "healthy"
          docker stop link-host-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' link-host-ci)" = "0"

      - name: Run the link host image on SQLite, with a volume, and see that it is ready and stops cleanly
        run: |
          docker run -d --name link-host-ci-sqlite --read-only --tmpfs /tmp --cap-drop ALL \
            -v link-host-ci-data:/data \
            -e ADMIN_TOKEN=ci-token-of-sixteen-characters -e PUBLIC_URL=https://links.example.org \
            -e DATABASE_URL=sqlite:///data/links.db refhir-link-host:ci
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' link-host-ci-sqlite)" = "healthy" ] && break
            sleep 2
          done
          docker logs link-host-ci-sqlite
          test "$(docker inspect -f '{{.State.Health.Status}}' link-host-ci-sqlite)" = "healthy"
          docker exec link-host-ci-sqlite node dist/server.js backup /data/backup.db
          docker stop link-host-ci-sqlite
          test "$(docker inspect -f '{{.State.ExitCode}}' link-host-ci-sqlite)" = "0"

      # The release's packages are in the image, so a first start needs no network, and the
      # deployment guide says to start from 512 MiB: run it so, and see that it starts and is not
      # killed for memory.
      - name: Start the image with no network and 512 MiB
        run: |
          docker run -d --name refhir-ci --network none --memory 512m --memory-swap 512m refhir:ci
          # The server answers 503 while it installs packages, so wait for /readyz to say 200. The
          # image has no curl; bash can open the connection.
          ready=false
          for _ in $(seq 1 120); do
            status="$(docker exec refhir-ci bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /readyz HTTP/1.0\r\nHost: x\r\n\r\n" >&3 && head -1 <&3' 2>/dev/null || true)"
            case "$status" in *" 200 "*) ready=true; break ;; esac
            [ "$(docker inspect -f '{{.State.Running}}' refhir-ci)" = "true" ] || break
            sleep 2
          done
          docker logs refhir-ci
          docker inspect -f 'running={{.State.Running}} oom-killed={{.State.OOMKilled}}' refhir-ci
          test "$ready" = true
          test "$(docker inspect -f '{{.State.OOMKilled}}' refhir-ci)" = "false"

      - name: Stop the image
        if: always()
        run: docker rm -f refhir-ci

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: helm lint deploy/helm/refhir

      - name: Render with the defaults
        run: helm template ci deploy/helm/refhir > /dev/null

      - name: Render a Postgres cluster
        run: helm template ci deploy/helm/refhir --set database.kind=postgres --set cluster.enabled=true > /dev/null

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown links and anchors
        run: python3 scripts/check-doc-links.py

  # Dependency advisories and licenses; see deny.toml. Advisories can appear without any change
  # here, so a failure on an unrelated pull request is a reason to update or review a dependency.
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2

  # The plan's performance exit criteria need a quiet machine and a few minutes, so they are not
  # part of every push. Trigger this job from the Actions tab with "perf" ticked; it fails if a pool
  # of 8 does not beat a pool of 1 on the search-heavy workload, and uploads the raw results.
  perf-smoke:
    name: Perf criteria (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build refhir (release)
        run: cargo build --release --locked -p refhir

      - name: Create an empty database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE perf"

      - name: Check the performance criteria
        env:
          PERF_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/perf
          PERF_OUT: ${{ runner.temp }}/perf
        run: scripts/perf-criteria.sh

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf/*.json
