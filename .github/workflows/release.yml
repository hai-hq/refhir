name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p refhir
      - run: |
          mkdir dist
          cp target/release/refhir dist/refhir-linux-amd64
          tar -czf refhir-linux-amd64.tar.gz -C dist refhir-linux-amd64
      - uses: softprops/action-gh-release@v2
        with:
          files: refhir-linux-amd64.tar.gz

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hai-hq/refhir:${{ github.ref_name }}
            ghcr.io/hai-hq/refhir:latest
