version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /clients/ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ts-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /link-host
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      link-host-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /link-host
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /clients/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
