[package]
name = "refhir-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP, SMART on FHIR and /sync WebSocket server for ReFHIR"

[dependencies]
refhir-database = { path = "../database" }
refhir-fhir = { path = "../fhir" }
axum = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
ureq = { workspace = true }
refhir-persistence = { path = "../persistence" }
refhir-types = { path = "../types" }
tracing = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
http-body-util = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
refhir-database = { path = "../database", features = ["test-util"] }
refhir-sqlite = { path = "../sqlite" }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }

[lints.clippy]
# Handlers and guards refuse a request by returning the `Response` they would have sent
# (`Err(response)`), so it can be returned with `?` or `return`. `Response` is large, and boxing it
# at every site would only add noise.
result_large_err = "allow"
