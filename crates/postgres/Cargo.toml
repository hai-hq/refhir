[package]
name = "refhir-postgres"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Postgres storage backend for ReFHIR"

[dependencies]
refhir-persistence = { path = "../persistence" }
refhir-types = { path = "../types" }
postgres = { workspace = true }
# TLS for the connection (`sslmode`, `sslrootcert`, ...). rustls is already in the tree through
# ureq; the ring provider is chosen explicitly so no process-wide default has to be installed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
percent-encoding = "2"
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
