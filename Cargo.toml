[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/persistence",
    "crates/sqlite",
    "crates/postgres",
    "crates/database",
    "crates/fhirpath",
    "crates/fhir",
    "crates/server",
    "crates/refhir",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = { version = "0.7", features = ["ws", "json"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http-body-util = "0.1"
