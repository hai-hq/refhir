[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/persistence",
    "crates/sqlite",
    "crates/postgres",
    "crates/database",
    "crates/fhirpath",
    "crates/validate",
    "crates/fhir",
    "crates/cql",
    "crates/map",
    "crates/sdc",
    "crates/sdc-wasm",
    "crates/server",
    "crates/refhir",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hai-hq/refhir"
homepage = "https://github.com/hai-hq/refhir"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
axum = { version = "0.7", features = ["ws", "json"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
http-body-util = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "pkcs5"] }
sha2 = "0.10"
hmac = "0.12"
toml = "0.8"

# Key derivation and RSA are unusably slow unoptimised; the SMART key tests depend on them.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Bulk package installs parse and store hundreds of MB; unoptimised SQLite and JSON make a
# debug run several times slower than release.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
