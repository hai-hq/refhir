# Production-oriented ReFHIR config. Copy and adjust for your environment.
# Do not commit real secrets — use the REFHIR_* env vars or your orchestrator's secrets.

[fhir]
version = "r4"

[server]
bind = "0.0.0.0:8080"
public_url = "https://refhir.example.com/fhir"
# Reverse proxies in front of this server (load balancer, ingress). Behind one, every client
# looks like the proxy unless this is set, and per-address limits and the audit trail then
# record the proxy's address for everyone. See deploy/production.md.
trusted_proxy_hops = 1
# The networks the proxies connect from, so that X-Forwarded-For is believed only from them and
# not from a client that reaches the server directly. Set it to your ingress or load balancer's
# range (the pod network, for an in-cluster ingress); see deploy/production.md.
# trusted_proxy_peers = ["10.0.0.0/8"]

[database]
kind = "postgres"
# Prefer REFHIR_POSTGRES_URL in Kubernetes instead of inline credentials.
# verify-full checks the server certificate and its host name against the CA in sslrootcert.
# `sslmode=require` alone encrypts but trusts anyone who answers.
postgres_url = "postgresql://refhir:CHANGE_ME@postgres:5432/refhir?sslmode=verify-full&sslrootcert=/etc/refhir-pg-tls/ca.crt"
# One database for many tenants: create each with `refhir tenant create NAME`, and name the one
# this process serves (or set REFHIR_TENANT). See docs/clustering.md.
# tenant = "acme"

[conformance]
reference_policy = "strict"
package_cache = "/data/package-cache"
# A name@version entry is downloaded, so it also needs package_download = true (the server
# downloads nothing otherwise); a directory or a .tgz needs no download.
# package_download = true
packages = [
  # "hl7.fhir.us.core@6.1.0",
]

[smart]
enabled = true
# Launch context for dev/staging only; production EHR launch supplies context.
# patient = "example-patient"
# Set via environment (see deploy/production.md):
# REFHIR_SMART_DCR_TOKEN
# REFHIR_SMART_CONFIDENTIAL_SECRET
# REFHIR_OIDC_CLIENT_SECRET

# Users sign in at your OpenID Connect provider (Keycloak, Okta, Entra ID, Auth0, ...).
# Register this redirect URI there: <public_url>/oauth/oidc/callback
[smart.oidc]
issuer = "https://idp.example.com/realms/clinic"
client_id = "refhir"
# client_secret: set REFHIR_OIDC_CLIENT_SECRET instead of writing it here.
scopes = ["openid", "profile"]
# ID token claim carrying the user's FHIR identity, e.g. "Practitioner/123".
fhir_user_claim = "fhirUser"
# Off unless set: accept only some of the people the provider signs in (see deploy/production.md).
# allowed_claims = { organization_id = ["org_abc123"] }
# allowed_email_domains = ["example.com"]
# Use the signed-in Patient as the launch patient instead of the patient picker.
# patient_from_fhir_user = true
# When the ID token has no fhirUser claim, find the person by searching your own data:
# Practitioner?identifier=<system>|<sub>
# [smart.oidc.fhir_user_lookup]
# resource_type = "Practitioner"
# claim = "sub"
# system = "https://idp.example.com/sub"

[export]
# Bulk $export writes NDJSON here, then clients download via GET /export/{job}/file.
# Object storage (S3/GCS) is not implemented yet — use a volume or sync this directory.
dir = "/data/export"

[terminology]
urls = []

[features]
trace_engine = false
sdc_archiver = false

# --- Limits, metering and audit (see deploy/production.md) -------------------------------------
# Size these for your traffic: they are a starting point, not a recommendation.

[metering]
enabled = true

[request_log]
enabled = true
store = true
retention_hours = 72

[audit]
enabled = true
reads = true
include_query = true
# The chain over the audit trail is keyed by REFHIR_AUDIT_KEY (see deploy/production.md): set it
# from your secret store, the same on every server. Without it the chain catches only mistakes.
# Keep the audit trail as long as your regulations require, e.g. 6 years (HIPAA documentation
# retention) = 2190. Unset keeps it forever.
# retention_days = 2190

[rate_limit]
enabled = true
requests_per_second = 50
burst = 100
auth_failures_per_minute = 20
max_sync_connections = 10
max_live_queries = 100

[rate_limit.cost]
read = 1
search = 2
write = 2
bundle = 5
operation = 5
export = 20
sync = 5

# Per-client daily and monthly totals. Off until you have a number for each tenant.
[quota]
enabled = false
# requests_per_day = 100000
# writes_per_day = 10000
