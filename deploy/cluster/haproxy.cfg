# Load balancer for deploy/cluster/docker-compose.yml.
#
# Every refhir process answers GET /healthz: 200 when it can take traffic, 503 when it cannot
# (a writer that is waiting for the writer lease, a replica that has fallen behind, a process
# that is still starting). HAProxy checks it once a second, so a standby joins the pool the
# moment it becomes the primary, and a replica leaves it while it is behind.

global
    maxconn 4096

# Resolve node names through Docker's DNS, and start even when a node is not up yet: it is
# simply marked down until it answers /healthz.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s

defaults
    mode http
    timeout connect 3s
    timeout client  60s
    timeout server  120s
    # /sync is a long-lived websocket.
    timeout tunnel  1h
    retries 2
    option redispatch
    option forwardfor

# Everything clients send. Reads are spread over every process that is ready; a replica sends
# the writes it receives on to the primary, so no routing rules by method are needed.
frontend fhir
    bind *:8080
    default_backend nodes

backend nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server writer1  writer1:8080
    server writer2  writer2:8080
    server replica1 replica1:8080
    server replica2 replica2:8080

# Where replicas send writes: only a process that reports itself as the primary. Internal;
# not published by the compose file.
frontend primary_only
    bind *:8081
    default_backend writer

backend writer
    option httpchk
    http-check send meth GET uri /healthz
    # The body is {"role":"primary",...}. Quotes would be stripped by the config parser, so the
    # pattern lets any character stand where they are.
    http-check expect rstring role.:.primary
    default-server check inter 1s fall 2 rise 2 init-addr last,libc,none resolvers docker
    server writer1 writer1:8080
    server writer2 writer2:8080

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
