apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "refhir.fullname" . }}
data:
  refhir.toml: |
    [fhir]
    version = "{{ .Values.fhir.version }}"

    [server]
    bind = "{{ .Values.server.bind }}"
    {{- if .Values.server.publicUrl }}
    public_url = "{{ .Values.server.publicUrl }}"
    {{- end }}
    {{- if .Values.server.trustedProxyHops }}
    trusted_proxy_hops = {{ .Values.server.trustedProxyHops }}
    {{- end }}
    {{- if .Values.server.trustedProxyPeers }}
    trusted_proxy_peers = [{{ range $i, $peer := .Values.server.trustedProxyPeers }}{{ if $i }}, {{ end }}"{{ $peer }}"{{ end }}]
    {{- end }}

    [database]
    kind = "{{ .Values.database.kind }}"
    {{- if eq .Values.database.kind "sqlite" }}
    sqlite_path = "{{ .Values.database.sqlitePath }}"
    {{- end }}
    {{- if eq .Values.database.kind "postgres" }}
    postgres_url = "{{ .Values.database.postgresUrl }}"
    {{- end }}

    {{- if .Values.cluster.enabled }}

    [cluster]
    db_pool = {{ .Values.cluster.dbPool }}
    {{- end }}

    [conformance]
    reference_policy = "{{ .Values.conformance.referencePolicy }}"
    {{- if .Values.conformance.packageRegistry }}
    package_registry = "{{ .Values.conformance.packageRegistry }}"
    {{- end }}
    {{- if .Values.conformance.packages }}
    packages = [
    {{- range .Values.conformance.packages }}
      "{{ . }}",
    {{- end }}
    ]
    {{- end }}

    [smart]
    enabled = {{ .Values.smart.enabled }}
    {{- if .Values.smart.demoLogin }}
    demo_login = true
    {{- end }}
    {{- if .Values.smart.oidc.issuer }}

    [smart.oidc]
    issuer = "{{ .Values.smart.oidc.issuer }}"
    client_id = "{{ .Values.smart.oidc.clientId }}"
    fhir_user_claim = "{{ .Values.smart.oidc.fhirUserClaim }}"
    scopes = [{{ range $i, $s := .Values.smart.oidc.scopes }}{{ if $i }}, {{ end }}"{{ $s }}"{{ end }}]
    {{- end }}

    [export]
    dir = "/data/export"

    [features]
    trace_engine = false
    sdc_archiver = false
{{- if .Values.extraConfig }}

{{ .Values.extraConfig | indent 4 }}
{{- end }}
