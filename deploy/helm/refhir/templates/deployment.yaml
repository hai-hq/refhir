{{- include "refhir.checkCluster" . -}}
{{- if not .Values.cluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "refhir.fullname" . }}
  labels:
    {{- include "refhir.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "refhir.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "refhir.labels" . | nindent 8 }}
    spec:
      {{- include "refhir.pod" (dict "root" . "role" "" "data" "pvc") | nindent 6 }}
{{- end }}
