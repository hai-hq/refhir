{{- $secretEnv := .Values.secretEnv | default dict }}
{{- if $secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "refhir.fullname" . }}-secrets
  labels:
    {{- include "refhir.labels" . | nindent 4 }}
stringData:
  {{- range $key, $value := $secretEnv }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
