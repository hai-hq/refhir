image:
  repository: ghcr.io/hai-hq/refhir
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

server:
  bind: "0.0.0.0:8080"
  publicUrl: ""
  # Reverse proxies in front of the server. An ingress is 1. Without it every client looks like
  # the ingress, so per-address limits and the audit trail see one caller. See deploy/production.md.
  trustedProxyHops: 0
  # The networks the proxies connect from, such as ["10.0.0.0/8"]: X-Forwarded-For is then
  # believed only on a connection from one of them. Unset, it is believed on every connection.
  trustedProxyPeers: []

database:
  kind: sqlite
  sqlitePath: /data/refhir.sqlite
  postgresUrl: ""

fhir:
  version: r4

conformance:
  referencePolicy: strict
  packages: []
  # Registry or mirror URL, or s3://bucket/prefix. For S3 or an S3-compatible store put the keys in
  # secretEnv (REFHIR_S3_ACCESS_KEY_ID, REFHIR_S3_SECRET_ACCESS_KEY) and, for a non-AWS store,
  # REFHIR_S3_ENDPOINT / REFHIR_S3_REGION.
  packageRegistry: ""

smart:
  enabled: false
  # Testing only: accepts any username with no credential check.
  demoLogin: false
  # OpenID Connect sign-in. Put the client secret in secretEnv as REFHIR_OIDC_CLIENT_SECRET.
  oidc:
    issuer: ""
    clientId: ""
    fhirUserClaim: fhirUser
    scopes: ["openid", "profile"]

# Optional keys → Secret + env (see deploy/production.md). Example:
# secretEnv:
#   REFHIR_POSTGRES_URL: "postgresql://..."
#   REFHIR_SMART_DCR_TOKEN: "..."
#   REFHIR_OIDC_CLIENT_SECRET: "..."
secretEnv: {}

resources: {}

# Any other refhir.toml sections, appended as they are. Usage, the request log and the audit
# trail are on without this; this is where limits go. Example:
# extraConfig: |
#   [rate_limit]
#   requests_per_second = 50
#   burst = 100
#
#   [quota]
#   requests_per_day = 100000
#
#   [audit]
#   retention_days = 2190
extraConfig: ""
