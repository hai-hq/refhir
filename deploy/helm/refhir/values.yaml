image:
  repository: ghcr.io/hai-hq/refhir
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

server:
  bind: "0.0.0.0:8080"
  publicUrl: ""

database:
  kind: sqlite
  # Name of an existing Secret with the files the Postgres URL points at (sslrootcert, and
  # sslcert/sslkey for client certificates). It is mounted at /etc/refhir-pg-tls, so a Secret
  # with a `ca.crt` key is reached as sslrootcert=/etc/refhir-pg-tls/ca.crt.
  tlsSecret: ""
  sqlitePath: /data/refhir.sqlite
  postgresUrl: ""

fhir:
  version: r4

# Several processes on one Postgres database. Needs database.kind: postgres.
#
# `writers` pods all start as standbys. One takes the writer lease and serves; the rest wait and
# take over within a couple of seconds when it goes away, so rolling updates and node failures do
# not stop writes for long. `replicas` pods serve reads from the same database and send writes
# to the live writer. Readiness is /healthz, so a standby or a lagging replica gets no traffic.
cluster:
  enabled: false
  writers: 2
  replicas: 2
  # Most database connections each pod opens.
  dbPool: 8
  # Where replicas send writes. Defaults to the <release>-primary Service, which only ever has
  # the live writer behind it.
  primaryUrl: ""
  # With smart.enabled every pod must agree on these (set them in secretEnv):
  #   REFHIR_SMART_DCR_TOKEN, REFHIR_SMART_CONFIDENTIAL_SECRET

conformance:
  referencePolicy: strict
  packages: []
  # Registry or mirror URL, or s3://bucket/prefix. For S3 or an S3-compatible store put the keys in
  # secretEnv (REFHIR_S3_ACCESS_KEY_ID, REFHIR_S3_SECRET_ACCESS_KEY) and, for a non-AWS store,
  # REFHIR_S3_ENDPOINT / REFHIR_S3_REGION.
  packageRegistry: ""

smart:
  enabled: false
  # Testing only: accepts any username with no credential check.
  demoLogin: false
  # OpenID Connect sign-in. Put the client secret in secretEnv as REFHIR_OIDC_CLIENT_SECRET.
  oidc:
    issuer: ""
    clientId: ""
    fhirUserClaim: fhirUser
    scopes: ["openid", "profile"]

# Optional keys → Secret + env (see deploy/production.md). Example:
# secretEnv:
#   REFHIR_POSTGRES_URL: "postgresql://..."
#   REFHIR_SMART_DCR_TOKEN: "..."
#   REFHIR_OIDC_CLIENT_SECRET: "..."
secretEnv: {}

resources: {}
