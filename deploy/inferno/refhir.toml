# ReFHIR profile for local SMART / Inferno validation (see README.md).

[fhir]
version = "r4"

[server]
bind = "0.0.0.0:8080"
public_url = "http://localhost:8080"

[database]
kind = "sqlite"
sqlite_path = "/data/refhir.sqlite"

[conformance]
reference_policy = "strict"
# seed.sh creates Patient/p1, the patient smart.patient names below, so the id must be the
# client's to choose.
update_as_create = true
package_cache = "/data/package-cache"

[smart]
enabled = true
# Inferno drives the sign-in page itself, so it uses the unauthenticated demo login.
# Never enable this on a server that holds real data.
demo_login = true
patient = "p1"
fhir_user = "Patient/inferno-user"

[export]
dir = "/data/export"

[features]
trace_engine = false
sdc_archiver = false
